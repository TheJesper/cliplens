<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="0.55" stop-color="#12112b"/>
      <stop offset="1" stop-color="#1b1038"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lensGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <!-- ambient glows -->
  <circle cx="880" cy="150" r="260" fill="url(#glowV)"/>
  <circle cx="1080" cy="300" r="200" fill="url(#glowC)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.045">
    <path d="M0 95 H1200 M0 190 H1200 M0 285 H1200"/>
    <path d="M150 0 V380 M300 0 V380 M450 0 V380 M600 0 V380 M750 0 V380 M900 0 V380 M1050 0 V380"/>
  </g>

  <!-- ===== left: wordmark ===== -->
  <g transform="translate(72,120)">
    <text x="0" y="0" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">ClipLens</text>
    <text x="3" y="52" font-size="27" font-weight="600" fill="#e6e9f5">The clipboard <tspan fill="#8b7cff">is</tspan> the API.</text>
    <text x="4" y="90" font-size="16.5" fill="#9aa3c7">Lenses read&#160;&#160;·&#160;&#160;Pens write&#160;&#160;·&#160;&#160;no API keys, no OAuth</text>
    <!-- chips -->
    <g transform="translate(4,120)" font-size="13.5" font-weight="600">
      <g><rect width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="36" y="20" text-anchor="middle" fill="#cbd2ee">Slack</text></g>
      <g transform="translate(84,0)"><rect width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="36" y="20" text-anchor="middle" fill="#cbd2ee">Mural</text></g>
      <g transform="translate(168,0)"><rect width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="36" y="20" text-anchor="middle" fill="#cbd2ee">Figma</text></g>
      <g transform="translate(252,0)"><rect width="82" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><text x="41" y="20" text-anchor="middle" fill="#cbd2ee">Outlook</text></g>
    </g>
  </g>

  <!-- ===== right: clipboard through a lens, with a pen ===== -->
  <g transform="translate(820,66)">
    <!-- beams from clipboard to floating dots -->
    <g stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M150 120 C 220 60, 280 40, 322 26" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.5"/>
      <path d="M150 140 C 230 150, 300 165, 344 176" stroke="#7c5cff" stroke-width="2.5" stroke-opacity="0.5"/>
      <path d="M150 160 C 210 210, 270 240, 300 258" stroke="#8ab4ff" stroke-width="2.5" stroke-opacity="0.45"/>
    </g>
    <circle cx="326" cy="24" r="7" fill="#22d3ee"/><circle cx="348" cy="178" r="7" fill="#7c5cff"/><circle cx="302" cy="260" r="7" fill="#8ab4ff"/>

    <!-- clipboard -->
    <g transform="translate(40,58)">
      <rect x="0" y="0" width="150" height="190" rx="14" fill="#161a33" stroke="#3a3f66" stroke-width="2"/>
      <rect x="46" y="-10" width="58" height="26" rx="9" fill="#2a2f57" stroke="#4b5186" stroke-width="2"/>
      <g stroke="#5b628f" stroke-width="7" stroke-linecap="round">
        <path d="M26 52 H124"/><path d="M26 78 H124"/><path d="M26 104 H96"/><path d="M26 130 H112"/><path d="M26 156 H80"/>
      </g>
    </g>

    <!-- magnifier lens over the clipboard -->
    <g filter="url(#soft)" opacity="0.9"><circle cx="150" cy="150" r="70" fill="#7c5cff" fill-opacity="0.18"/></g>
    <circle cx="150" cy="150" r="70" fill="url(#lensGlass)" stroke="#b9c6ff" stroke-width="5" stroke-opacity="0.85"/>
    <circle cx="150" cy="150" r="70" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>
    <line x1="200" y1="200" x2="246" y2="246" stroke="#b9c6ff" stroke-width="12" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="246" y2="246" stroke="#8a97d8" stroke-width="5" stroke-linecap="round"/>
    <!-- lens highlight -->
    <path d="M120 120 A55 55 0 0 1 175 108" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

    <!-- pen -->
    <g transform="rotate(38 300 90)">
      <rect x="270" y="80" width="120" height="14" rx="7" fill="#c9b8ff"/>
      <rect x="270" y="80" width="42" height="14" rx="7" fill="#7c5cff"/>
      <path d="M390 87 l22 -6 -6 20 z" fill="#e6e9f5"/>
    </g>
  </g>
</svg>
