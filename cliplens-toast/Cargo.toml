[package]
name = "cliplens-daemon"
version = "0.2.0"
edition = "2021"
description = "Cross-platform notification daemon + clip-history picker for ClipLens"

[[bin]]
name = "cliplens-daemon"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.45"
global-hotkey = "0.6"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Named-pipe IPC + audio on Windows via std + winapi-free approach (interprocess crate)
interprocess = "2"

[target.'cfg(unix)'.dependencies]
interprocess = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
