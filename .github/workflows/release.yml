name: Release daemon binaries

# Builds the cross-platform cliplens-daemon (Rust + wry) for Windows, macOS and Linux
# and attaches the native binaries to the GitHub Release. End users download a binary —
# no Rust toolchain required.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: nothing by default; only the build job may write the release and attest it.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cliplens-daemon
            asset: cliplens-daemon-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cliplens-daemon
            asset: cliplens-daemon-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            bin: cliplens-daemon
            asset: cliplens-daemon-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cliplens-daemon.exe
            asset: cliplens-daemon-windows-x64.exe
    steps:
      # Actions are pinned to full commit SHAs (a moved tag cannot change what runs here).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: cliplens-toast

      - name: Install Linux WebKit/GTK deps (wry)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Build
        working-directory: cliplens-toast
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          cp "cliplens-toast/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          # Checksum next to the binary so a download can be verified.
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
